name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Restore fixed signing key
        run: |
          if [ -z "${{ secrets.NOTIFVOICE_KEYSTORE }}" ]; then echo "NOTIFVOICE_KEYSTORE secret is not set" >&2; exit 1; fi
          echo "${{ secrets.NOTIFVOICE_KEYSTORE }}" | base64 -d > debug.keystore
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NotifVoice-apk
          path: build/outputs/apk/debug/*.apk
